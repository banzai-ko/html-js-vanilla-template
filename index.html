
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Sistema de gestión de [ENTIDAD].">

    <title>Gestión de [ENTIDAD] | Prog III</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>

    <link rel="stylesheet" href="./css/estilos.css">
    <script src="./js/manejadora.js" defer></script>
</head>

<body>
    <header class="container py-4">
        <h1>Gestión de [ENTIDAD]</h1>
        <p>Pre parcial de Programación III</p>
    </header>

    <main class="container pb-4">

        <!-- Listado -->
        <section aria-labelledby="listado-title">
            <h2 id="listado-title">Listado de [ENTIDADES]</h2>

            <div
                id="loading"
                class="d-none"
                role="status"
                aria-live="polite"
            >
                Cargando datos...
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="data_table"></tbody>
                </table>
            </div>
        </section>

        <!-- Formulario -->
        <section class="card mt-4" aria-labelledby="form-title">
            <div class="card-body">
                <h2 id="form-title" class="h4">Agregar [entidad]</h2>

                <form id="form_entidad">
                    <input type="hidden" id="entidad_id" name="id">

                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            name="name"
                            required
                            minlength="3"
                            maxlength="100"
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="submit-button"
                    >
                        Agregar [entidad]
                    </button>

                    <button
                        type="reset"
                        class="btn btn-secondary"
                        id="reset-button"
                    >
                        Limpiar
                    </button>
                </form>
            </div>
        </section>

        <!-- Notificaciones -->
        <div
            id="notifications"
            class="toast-container position-fixed top-0 end-0 p-3"
            aria-live="polite"
        ></div>

    </main>
</body>
</html>
